# Publica la web DEFINITIVA en la raíz de nutriendohabitos.es (DonDominio) por FTP.
# Se lanza sola cada vez que cambian las fuentes (_fuente/) en main, y también a mano:
# GitHub → Actions → «Publicar web» → Run workflow.
# Los datos de acceso NO están en el código: son «secrets» del repositorio que pone Andrea:
#   FTP_SERVIDOR, FTP_USUARIO, FTP_CONTRASENA  y, opcional, FTP_CARPETA_WEB (por defecto ./ = carpeta de la cuenta FTP)
# Nunca se sube ni se borra reservas/datos (citas, pacientes, contraseña del panel).
name: Publicar web
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['_fuente/**']
concurrency: publicar-web
jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      HAY_FTP: ${{ secrets.FTP_SERVIDOR != '' && secrets.FTP_USUARIO != '' && secrets.FTP_CONTRASENA != '' }}
    steps:
      - name: Comprobar datos FTP
        if: env.HAY_FTP != 'true'
        run: echo "::notice::Faltan los secrets FTP_SERVIDOR, FTP_USUARIO y FTP_CONTRASENA. No se publica nada."
      - uses: actions/checkout@v4
        if: env.HAY_FTP == 'true'
      - name: Construir la web definitiva
        if: env.HAY_FTP == 'true'
        run: cd _fuente && python3 build.py definitiva
      - name: Subir por FTP (sin tocar reservas/datos)
        if: env.HAY_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVIDOR }}
          username: ${{ secrets.FTP_USUARIO }}
          password: ${{ secrets.FTP_CONTRASENA }}
          local-dir: _fuente/build/definitiva/
          server-dir: ${{ secrets.FTP_CARPETA_WEB || './' }}
          exclude: |
            **/.git*
            **/.git*/**
            reservas/datos/**
      - name: Avisar a Bing y otros buscadores (IndexNow)
        if: env.HAY_FTP == 'true'
        continue-on-error: true
        run: |
          KEY=$(ls _fuente/build/definitiva/ | grep -E '^[0-9a-f]{32}\.txt$' | head -1 | sed 's/\.txt$//')
          URLS=$(grep -o '<loc>[^<]*' _fuente/build/definitiva/sitemap.xml | sed 's/<loc>//' | python3 -c 'import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          BODY="{\"host\":\"www.nutriendohabitos.es\",\"key\":\"$KEY\",\"keyLocation\":\"https://www.nutriendohabitos.es/$KEY.txt\",\"urlList\":$URLS}"
          sleep 20
          curl -s -o /dev/null -w 'IndexNow: %{http_code}\n' -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d "$BODY"
